# 24 GB VRAM (3090/4090) için rahat ayar: daha uzun dizi, daha büyük LoRA.
base_model: unsloth/Qwen2.5-7B-Instruct-bnb-4bit
max_seq_length: 4096
load_in_4bit: true

lora_r: 64
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true
gradient_checkpointing: unsloth

epochs: 3.0
batch_size: 4
grad_accum: 4
learning_rate: 1.0e-4
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler: cosine
optim: adamw_bnb_8bit
bf16: true

dataset_dir: data/dataset
output_dir: models/kitapai-lora-7b
logging_steps: 10
eval_steps: 200
save_steps: 400
